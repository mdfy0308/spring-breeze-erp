name: Deploy SBerp v3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend
        working-directory: ./BACK
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Frontend
        working-directory: ./FRONT
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Deploy Backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: BACK/build/libs/*.jar
          target: /home/ubuntu/app/back/build/libs/
          strip_components: 4

      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: FRONT/
          target: /home/ubuntu/app/front/
          strip_components: 1

      - name: Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 환경변수 로드
            export $(cat /home/ubuntu/app/.env | xargs)

            # 백엔드 재시작
            cd /home/ubuntu/app/back/build/libs
            pm2 delete backend 2>/dev/null || true
            pm2 start "java -jar -Dspring.profiles.active=prod $(ls -t *.jar | head -1)" --name backend

            # 프론트엔드 재시작
            cd /home/ubuntu/app/front
            npm ci --production
            pm2 delete frontend 2>/dev/null || true
            NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL pm2 start npm --name frontend -- start

            pm2 save